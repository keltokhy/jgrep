[project]
name = "jev-grep"
version = "0.3.0"
description = "grep by meaning: filter lines with a plain-English description, judged by TypeSafe's Jev model"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "jevkit-runtime>=0.2.0,<0.3.0",
    "httpx>=0.27",
    "pathspec>=0.12",
    "unidiff>=0.7.5,<0.8",
]
keywords = ["grep", "cli", "semantic search", "jev", "typesafe", "openrouter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/keltokhy/jgrep"

[project.scripts]
jgrep = "jgrep.cli:cli"

[project.optional-dependencies]
code = [
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-go>=0.25,<0.26",
    "tree-sitter-c>=0.24,<0.25",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jgrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
jevkit-runtime = { path = "../jevkit-core", editable = true }
