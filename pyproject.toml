[project]
name = "jev-grep"
version = "0.1.1"
description = "grep by meaning: filter lines with a plain-English description, judged by TypeSafe's Jev model"
readme = "README.md"
license = "MIT"
authors = [{ name = "Khaled Eltokhy" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pathspec>=0.12",
]
keywords = ["grep", "cli", "semantic search", "jev", "typesafe", "openrouter"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/keltokhy/jgrep"

[project.scripts]
jgrep = "jgrep.cli:cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jgrep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
